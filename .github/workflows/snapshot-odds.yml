name: Snapshot odds

on:
  schedule:
    # Times are UTC (ET is UTC−4 until Nov 1, then UTC−5, so these run an hour earlier in ET after that).
    # Sunday 9 PM ET (Monday 01:00 UTC): near the opener, when the model's picks are meant to be bet.
    # Tuesday and Friday 10 AM ET, and Saturday 9 AM ET: the last one is the close for most games.
    # GitHub can start scheduled runs hours late, so Saturday's isn't right before noon kickoffs.
    - cron: "0 1 * 8-12 1"
    - cron: "0 14 * 8-12 2,5"
    - cron: "0 13 * 8-12 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Refresh games and ratings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: node scripts/build-data.mjs
      - name: Fetch odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/fetch-odds.mjs
      - name: Record picks
        run: node scripts/record-picks.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: odds snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q
          git push
