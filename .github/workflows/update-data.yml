name: Update data

on:
  schedule:
    # Times are UTC (ET is UTC−4 until Nov 1, then UTC−5). Every 3 hours from Saturday noon ET to
    # Sunday 3 AM ET while games finish, then Sunday, Monday and Wednesday mornings (6 AM ET) to catch
    # late finals and weeknight games. August through December.
    - cron: "0 16,19,22 * 8-12 6"
    - cron: "0 1,4,7,10 * 8-12 0"
    - cron: "0 10 * 8-12 1,3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: node scripts/build-data.mjs
      - name: Grade picks
        run: node scripts/grade-picks.mjs
      - name: Commit if changed
        run: |
          # `updated` changes on every run, so ignore it when deciding whether anything changed.
          node -e '
            const { execSync } = require("child_process");
            const changed = execSync("git ls-files --modified --others --exclude-standard -- data").toString().split("\n").filter(Boolean);
            const strip = (s) => s.replace(/"updated":"[^"]*",?/, "");
            const fs = require("fs");
            const real = changed.some((f) => {
              let old = "";
              try { old = execSync(`git show HEAD:${f}`).toString(); } catch { return true; }
              return strip(old) !== strip(fs.readFileSync(f, "utf8"));
            });
            fs.writeFileSync(process.env.GITHUB_ENV, `DATA_CHANGED=${real}\n`, { flag: "a" });
          '
      - name: Push
        if: env.DATA_CHANGED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q
          git push
