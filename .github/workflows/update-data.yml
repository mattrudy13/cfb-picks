name: Update data

on:
  schedule:
    # Every 3 hours from Saturday noon ET to Sunday 3 AM ET while games finish, then Sunday, Monday and
    # Wednesday mornings (6 AM ET) to catch late finals and weeknight games. August through December.
    # Cron is UTC, so the schedule is split by month to keep the ET times fixed: Aug–Oct are UTC−4
    # (daylight time), Nov–Dec UTC−5. Daylight time ends the first Sunday of November, so in years when
    # that's after Nov 1 the first few November runs are an hour early.
    - cron: "0 16,19,22 * 8-10 6"
    - cron: "0 1,4,7,10 * 8-10 0"
    - cron: "0 10 * 8-10 1,3"
    - cron: "0 17,20,23 * 11-12 6"
    - cron: "0 2,5,8,11 * 11-12 0"
    - cron: "0 11 * 11-12 1,3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: node scripts/build-data.mjs
      - name: Grade picks
        run: node scripts/grade-picks.mjs
      - name: Commit if changed
        run: |
          # `updated` changes on every run, so ignore it when deciding whether anything changed.
          node -e '
            const { execSync } = require("child_process");
            const changed = execSync("git ls-files --modified --others --exclude-standard -- data").toString().split("\n").filter(Boolean);
            const strip = (s) => s.replace(/"updated":"[^"]*",?/, "");
            const fs = require("fs");
            const real = changed.some((f) => {
              let old = "";
              try { old = execSync(`git show HEAD:${f}`).toString(); } catch { return true; }
              return strip(old) !== strip(fs.readFileSync(f, "utf8"));
            });
            fs.writeFileSync(process.env.GITHUB_ENV, `DATA_CHANGED=${real}\n`, { flag: "a" });
          '
      - name: Push
        if: env.DATA_CHANGED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q
          git push
