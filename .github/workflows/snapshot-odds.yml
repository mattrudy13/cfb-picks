name: Snapshot odds

on:
  schedule:
    # Sunday 9 PM ET (Monday 01:00 UTC in daylight time): near the opener, when the model's picks are
    # meant to be bet. Tuesday and Friday 10 AM ET, and Saturday 9 AM ET: the last snapshot before most
    # games. GitHub can start scheduled runs hours late, so Saturday's isn't right before noon kickoffs.
    # Cron is UTC, so the schedule is split by month to keep the ET times fixed: Aug–Oct are UTC−4
    # (daylight time), Nov–Dec UTC−5 (see update-data.yml).
    - cron: "0 1 * 8-10 1"
    - cron: "0 14 * 8-10 2,5"
    - cron: "0 13 * 8-10 6"
    - cron: "0 2 * 11-12 1"
    - cron: "0 15 * 11-12 2,5"
    - cron: "0 14 * 11-12 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Refresh games and ratings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: node scripts/build-data.mjs
      - name: Fetch odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/fetch-odds.mjs
      - name: Record picks
        run: node scripts/record-picks.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: odds snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q
          git push
